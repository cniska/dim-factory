# Tailwind runs through the HTML bundler that serves the wall, which reads its plugins here
# rather than from a build call.
[serve.static]
plugins = ["bun-plugin-tailwind"]

# The plugin's peer `bun` package, installed without its postinstall as the factory installs, puts a
# placeholder `bun` first on `bun run`'s PATH.
[install]
peer = false
