name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A superseded pull request run is worth cancelling; a push to main is the run
  # that says whether main is green, so it finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # mise.toml is the single toolchain pin, so CI runs the bun the owner runs.
      - uses: jdx/mise-action@v5

      - run: bun install --frozen-lockfile

      - run: bun run verify

  acceptance:
    name: Acceptance
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bun run test:acceptance

  commits:
    name: Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # A branch's first push reports an all-zero base, which names no commit. Falling
      # back to the head's parent judges the one commit that certainly arrived, rather
      # than reporting a clean run over an empty range.
      - name: Resolve the pushed range
        id: range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          git cat-file -e "$base^{commit}" 2>/dev/null || base="$HEAD_SHA^"
          echo "range=$base..$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Judge each subject
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          for sha in $(git rev-list --no-merges "$RANGE"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            case "$(head -n 1 "$RUNNER_TEMP/message")" in
              "fixup! "*) echo "$sha is a fixup left in the range; squash it into the commit it names." >&2; exit 1 ;;
            esac
            sh .githooks/commit-msg "$RUNNER_TEMP/message"
          done
