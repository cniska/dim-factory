name: Acceptance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  # A superseded pull request run is worth cancelling; a push to main is the run
  # that says whether main is green, so it finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance:
    name: Acceptance
    # The acceptance suite drives the check's sandbox, which is macOS's sandbox-exec.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bun run test:acceptance
